# Full self-hosted Muesli stack: Postgres + Ollama (self-hosted LLM) + Whisper
# (self-hosted transcription) + the two plugins + the Go server.
#
# `docker compose up` works with NO .env file: every secret/URL below uses a
# ${VAR:-default} dev fallback. Copy .env.example to .env and set real values
# for anything other than local development. The built-in defaults are DEV ONLY.
#
# First boot pulls the Ollama model (~2 GB for llama3.2:3b) and the Whisper
# model on first transcription, so the initial run takes a few minutes and CPU
# inference is slow.

services:
  postgres:
    # pgvector image (a superset of postgres:16) so the semantic-search migration can
    # CREATE EXTENSION vector. Drop-in compatible with the prior postgres:16-alpine.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: muesli
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d muesli']
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      # The ollama CLI talks to the local server; `ollama list` succeeds once it's up.
      test: ['CMD-SHELL', 'ollama list || exit 1']
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot: pull the default model into the ollama volume, then exit.
  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./infra/ollama-pull.sh:/ollama-pull.sh:ro
    entrypoint: ['/bin/sh', '/ollama-pull.sh']
    command: ['llama3.2:3b']
    restart: 'no'

  # One-shot: pull the embedding model (semantic search) into the ollama volume.
  ollama-pull-embed:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./infra/ollama-pull.sh:/ollama-pull.sh:ro
    entrypoint: ['/bin/sh', '/ollama-pull.sh']
    command: ['nomic-embed-text']
    restart: 'no'

  whisper:
    build: ./plugins/whisper-transcriber
    environment:
      MUESLI_PLUGIN_TOKEN: ${WHISPER_TOKEN:-dev-whisper-token}
      WHISPER_MODEL: base
    healthcheck:
      # The python image has no curl; use the bundled Python to hit /health.
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:8000/health'').status==200 else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  agent:
    build: ./plugins/ollama-agent
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      MUESLI_PLUGIN_TOKEN: ${AGENT_TOKEN:-dev-agent-token}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:8000/health'').status==200 else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      whisper:
        condition: service_healthy
      agent:
        condition: service_healthy
    ports:
      - '8080:8080'
    volumes:
      - audio:/data/audio
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/muesli?sslmode=disable
      # DEV-ONLY default key. Generate a real one with `openssl rand -base64 32`.
      MUESLI_MASTER_KEY: ${MUESLI_MASTER_KEY:-+kdb0f+R3nCdy80T2zDMmZm5lUxfWpzehijIE3Zvsw8=}
      MUESLI_STORAGE_SIGNING_KEY: ${MUESLI_STORAGE_SIGNING_KEY:-dev-storage-signing-key-change-me}
      MUESLI_STORAGE_DIR: /data/audio
      # Client/desktop-facing base URL (used in signed UPLOAD urls).
      MUESLI_PUBLIC_URL: ${MUESLI_PUBLIC_URL:-http://localhost:8080}
      # Plugin-facing base URL (used in DOWNLOAD urls so whisper can fetch audio
      # by the in-network service name).
      MUESLI_INTERNAL_URL: http://server:8080
      # Auto-register the default plugins on startup (no manual admin steps).
      MUESLI_DEFAULT_TRANSCRIBER_URL: http://whisper:8000
      MUESLI_DEFAULT_TRANSCRIBER_TOKEN: ${WHISPER_TOKEN:-dev-whisper-token}
      MUESLI_DEFAULT_TRANSCRIBER_CONFIG: '{"model":"base"}'
      MUESLI_DEFAULT_AGENT_URL: http://agent:8000
      MUESLI_DEFAULT_AGENT_TOKEN: ${AGENT_TOKEN:-dev-agent-token}
      MUESLI_DEFAULT_AGENT_CONFIG: '{"ollama_url":"http://ollama:11434","model":"llama3.2:3b"}'
      # Semantic search: self-hosted embeddings via Ollama. Unset MUESLI_EMBEDDINGS_URL to disable
      # (search falls back to lexical-only).
      MUESLI_EMBEDDINGS_URL: ${MUESLI_EMBEDDINGS_URL:-http://ollama:11434}
      # Any Ollama embedding model; dimension is automatic (unsized vector column).
      # After changing it, restart (auto re-embed) or run `docker compose run --rm
      # server reembed`. Candidates: nomic-embed-text 768, qwen3-embedding 1024,
      # bge-m3 1024 — each may want its own DOC/QUERY prefixes and min-score.
      MUESLI_EMBEDDINGS_MODEL: ${MUESLI_EMBEDDINGS_MODEL:-nomic-embed-text}
      # Cosine cutoff for a semantic hit (0–1). Higher = stricter/fewer results,
      # lower = more (looser) matches. Default 0.5 suits nomic-embed-text.
      MUESLI_EMBEDDINGS_MIN_SCORE: ${MUESLI_EMBEDDINGS_MIN_SCORE:-0.6}

    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8080/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  ollama:
  audio:
