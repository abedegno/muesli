[project]
name = "muesli-streaming-transcriber"
version = "0.1.0"
description = "Muesli streaming transcriber plugin (FastAPI + webrtcvad + faster-whisper)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    # webrtcvad 2.0.10 imports pkg_resources in webrtcvad.py; setuptools>=81 makes importing it fail.
    "setuptools<85",
    "faster-whisper>=1.0",
    "webrtcvad>=2.0.10",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "respx>=0.21", "freezegun>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["streaming_app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep" = { msg = "Use frozen_clock fixture instead of time.sleep in tests." }
"datetime.datetime.now" = { msg = "Use frozen_clock fixture instead of datetime.now() in tests." }
