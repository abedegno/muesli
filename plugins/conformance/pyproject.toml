[project]
name = "muesli-plugin-conformance"
version = "0.1.0"
description = "Conformance test harness for Muesli transcriber/agent plugins"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
# The conformance package itself stays dependency-light (httpx + jsonschema) so
# it can validate arbitrary third-party plugins. The *test* suite additionally
# self-certifies the reference whisper plugin, which is installed editable
# alongside this package (a test-only path dependency):
#     pip install -e ../whisper-transcriber
# CI installs both editable packages before running these tests.
test = ["pytest>=8.2", "fastapi>=0.111", "respx>=0.21", "freezegun>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Explicit package list so setuptools does not try to auto-discover (the flat
# layout with a top-level tests/ dir confuses auto-discovery).
[tool.setuptools]
packages = ["muesli_plugin_conformance"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep" = { msg = "Use frozen_clock fixture instead of time.sleep in tests." }
"datetime.datetime.now" = { msg = "Use frozen_clock fixture instead of datetime.now() in tests." }
