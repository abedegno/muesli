version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - 'type:chore'
      - 'area:server'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - 'type:chore'
      - 'area:ui'
    # Keep Electron updates individual: stale Electron versions are a desktop security exposure.
    groups:
      non-major:
        patterns: ['*']
        exclude-patterns: ['electron']
        update-types: ['minor', 'patch']

  - package-ecosystem: pip
    directory: /plugins/conformance
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - 'type:chore'
      - 'area:plugins'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']

