version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - 'type:chore'
      - 'area:server'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - 'type:chore'
      - 'area:ui'
    # TypeScript 7 removes the JS compiler API used by typescript-eslint.
    # Electron Vite 5 supports Vite <=7; plugin-react 6 requires Vite 8.
    # Vitest 4 changes branch accounting (73.56% vs the 84.19% gate in trial);
    # migrate coverage separately before upgrading the desktop test runner.
    # Revisit these deferrals when those upstream compatibility ranges change.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
      - dependency-name: vitest
        versions: ['>=4']
      - dependency-name: '@vitest/coverage-v8'
        versions: ['>=4']
      - dependency-name: vite
        versions: ['>=8']
      - dependency-name: '@vitejs/plugin-react'
        versions: ['>=6']
    # Keep Electron updates individual: stale Electron versions are a desktop security exposure.
    groups:
      non-major:
        patterns: ['*']
        exclude-patterns: ['electron']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /web/admin
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - 'type:chore'
      - 'area:ui'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: pip
    directory: /plugins/conformance
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - 'type:chore'
      - 'area:plugins'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: pip
    directory: /plugins/ollama-agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - 'type:chore'
      - 'area:plugins'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: pip
    directory: /plugins/parakeet-transcriber
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - 'type:chore'
      - 'area:plugins'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: pip
    directory: /plugins/streaming-transcriber
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - 'type:chore'
      - 'area:plugins'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # webrtcvad 2.0.10 imports pkg_resources, which setuptools>=81 removes.
      # Keep this aligned with the setuptools<81 pin in pyproject.toml; remove
      # both only after webrtcvad no longer depends on pkg_resources.
      - dependency-name: 'setuptools'

  - package-ecosystem: pip
    directory: /plugins/whisper-transcriber
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - 'type:chore'
      - 'area:plugins'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /
    # Keep the server build on Node 24 LTS; review a new major at LTS adoption.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - 'type:chore'
      - 'area:infra'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /plugins/ollama-agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - 'type:chore'
      - 'area:plugins'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /plugins/parakeet-transcriber
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - 'type:chore'
      - 'area:plugins'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /plugins/streaming-transcriber
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - 'type:chore'
      - 'area:plugins'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /plugins/whisper-transcriber
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - 'type:chore'
      - 'area:plugins'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - 'type:chore'
      - 'area:infra'
    groups:
      non-major:
        patterns: ['*']
        update-types: ['minor', 'patch']
