name: Build whisper.cpp lib

# Builds a PINNED whisper.cpp into the vendored static libs that
# cmd/whisper-cpp-transcriber links via cgo. Its output is consumed by that
# plugin's build (CI + the Bircher runner) - whisper.cpp is compiled ONCE here,
# never per plugin build.
#
# MVP scope: linux-amd64, CPU only. This is the only platform the CI matrix and
# the Bircher runner build/test today, and what hosted-Linux uses. darwin (Metal)
# and windows are the GPU/desktop fast-follow: the whisper.cpp Go bindings
# hardcode `#cgo darwin LDFLAGS: -lggml-metal -lggml-blas -framework Metal ...`,
# so a CPU-only mac build needs LDFLAGS overrides - handled in that later wave.
#
# Verified recipe (2026-07-14, on Debian 13 x86_64, Go 1.25): `make whisper` in
# bindings/go produces libwhisper.a + libggml{,-cpu,-base}.a and the headers;
# `go build ./...` against ONLY the assembled artifact links cleanly.

on:
  workflow_dispatch:
    inputs:
      whisper_ref:
        description: 'whisper.cpp git ref (tag or full SHA)'
        required: false
        default: '080bbbe85230f624f0b52127f1ae1218247989f9'
  push:
    paths:
      - '.github/workflows/build-whisper-lib.yml'

permissions:
  contents: read

env:
  DEFAULT_REF: '080bbbe85230f624f0b52127f1ae1218247989f9'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve whisper.cpp ref
        id: ref
        run: echo "ref=${{ github.event.inputs.whisper_ref || env.DEFAULT_REF }}" >> "$GITHUB_OUTPUT"

      - name: Install build toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential cmake git

      - name: Clone whisper.cpp at the pinned ref
        run: |
          git clone https://github.com/ggml-org/whisper.cpp wcpp
          git -C wcpp checkout "${{ steps.ref.outputs.ref }}"

      - name: Build CPU static libs (make whisper)
        run: |
          cd wcpp/bindings/go
          make whisper

      - name: Assemble vendored artifact
        run: |
          ref="${{ steps.ref.outputs.ref }}"
          out="whisper-cpp-${{ matrix.platform }}"
          mkdir -p "$out/lib" "$out/include"
          cp wcpp/build_go/src/libwhisper.a "$out/lib/"
          cp wcpp/build_go/ggml/src/libggml.a \
             wcpp/build_go/ggml/src/libggml-cpu.a \
             wcpp/build_go/ggml/src/libggml-base.a "$out/lib/"
          cp wcpp/include/whisper.h "$out/include/"
          cp wcpp/ggml/include/*.h "$out/include/"
          printf 'whisper.cpp %s\nplatform %s\nbackend cpu\n' "$ref" "${{ matrix.platform }}" > "$out/VERSION"
          ( cd "$out" && find . -type f ! -name SHA256SUMS | sort | xargs sha256sum > SHA256SUMS )
          tar -czf "$out.tar.gz" "$out"
          echo "=== $out contents ==="; ls -la "$out/lib" "$out/include"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cpp-${{ matrix.platform }}
          path: whisper-cpp-*.tar.gz
          retention-days: 90
