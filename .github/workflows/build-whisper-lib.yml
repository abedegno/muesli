name: Build whisper.cpp lib

# Builds a PINNED whisper.cpp into the vendored static libs that
# cmd/whisper-cpp-transcriber links via cgo. whisper.cpp is compiled ONCE here,
# never per plugin build.
#
# Backends: linux-amd64 = CPU; darwin = Metal (the whisper.cpp Go bindings
# default to `-lggml-metal -lggml-blas -framework Metal` on darwin, which is the
# win on Apple Silicon). Windows is a further follow-up (its cgo toolchain +
# bindings path need their own handling).
#
# Verified (2026-07-14, Debian 13 x86_64): `make whisper` in bindings/go ->
# libwhisper.a + libggml{,-cpu,-base}.a + headers; `go build` against the
# assembled artifact links cleanly. The assemble step globs ALL produced libs
# so it also captures darwin's libggml-metal/libggml-blas.

on:
  workflow_dispatch:
    inputs:
      whisper_ref:
        description: 'whisper.cpp git ref (tag or full SHA)'
        required: false
        default: '080bbbe85230f624f0b52127f1ae1218247989f9'
  push:
    paths:
      - '.github/workflows/build-whisper-lib.yml'

permissions:
  contents: read

env:
  DEFAULT_REF: '080bbbe85230f624f0b52127f1ae1218247989f9'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-latest
            backend: cpu
          - platform: darwin-arm64
            os: macos-14
            backend: metal
          # darwin-amd64 (Intel, macos-13) omitted: Apple-Silicon-first, and
          # GitHub's Intel-mac runners queue indefinitely. Re-add for a future
          # universal/Intel build when the desktop app needs an x64 mac lib.
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve whisper.cpp ref
        id: ref
        run: echo "ref=${{ github.event.inputs.whisper_ref || env.DEFAULT_REF }}" >> "$GITHUB_OUTPUT"

      - name: Install build toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential cmake git

      - name: Clone whisper.cpp at the pinned ref
        run: |
          git clone https://github.com/ggml-org/whisper.cpp wcpp
          git -C wcpp checkout "${{ steps.ref.outputs.ref }}"

      - name: Build static libs (make whisper)
        run: |
          cd wcpp/bindings/go
          make whisper

      - name: Assemble vendored artifact
        run: |
          ref="${{ steps.ref.outputs.ref }}"
          out="whisper-cpp-${{ matrix.platform }}"
          mkdir -p "$out/lib" "$out/include"
          # Glob ALL produced static libs (CPU: libwhisper + libggml{,-cpu,-base};
          # Metal adds libggml-metal + libggml-blas).
          find wcpp/build_go \( -name 'libwhisper.a' -o -name 'libggml*.a' \) -exec cp {} "$out/lib/" \;
          cp wcpp/include/*.h "$out/include/"
          cp wcpp/ggml/include/*.h "$out/include/"
          printf 'whisper.cpp %s\nplatform %s\nbackend %s\n' "$ref" "${{ matrix.platform }}" "${{ matrix.backend }}" > "$out/VERSION"
          ( cd "$out" && find . -type f ! -name SHA256SUMS | sort | xargs shasum -a 256 > SHA256SUMS )
          tar -czf "$out.tar.gz" "$out"
          echo "=== $out lib/ ==="; ls -la "$out/lib"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cpp-${{ matrix.platform }}
          path: whisper-cpp-*.tar.gz
          retention-days: 90
