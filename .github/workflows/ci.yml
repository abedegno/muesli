name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  coverage-report:
    name: coverage report (informational)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: muesli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve DB URL
        run: echo "TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/muesli_test?sslmode=disable" >> "$GITHUB_ENV"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: Measure server coverage
        run: go test $(go list ./... | grep -v '/node_modules/') -p 4 -parallel 2 -coverprofile=coverage.out
      - name: Enforce server coverage floor
        run: scripts/check-coverage.sh coverage.out coverage-floors/server.txt
      - name: Measure and enforce client coverage
        run: npm run test:coverage
      - name: Build coverage report
        run: |
          server_total=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')
          server_floor=$(tr -d '[:space:]' < coverage-floors/server.txt)
          client_total=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          client_floor=$(awk '/^[[:space:]]+lines:/ { gsub(/,/, "", $2); print $2; exit }' vitest.config.ts)
          server_delta=$(awk -v current="$server_total" -v floor="$server_floor" 'BEGIN { printf "%+.1f", current - floor }')
          client_delta=$(awk -v current="$client_total" -v floor="$client_floor" 'BEGIN { printf "%+.2f", current - floor }')
          {
            echo '## Coverage report'
            echo
            echo '| Suite | Current | Floor | Delta |'
            echo '| --- | ---: | ---: | ---: |'
            echo "| Server (Go) | ${server_total}% | ${server_floor}% | ${server_delta} points |"
            echo "| Client (Vitest, lines) | ${client_total}% | ${client_floor}% | ${client_delta} points |"
          } | tee coverage-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish coverage on pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file coverage-report.md

  server:
    name: server (go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: muesli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.11'
      - name: Resolve DB URL
        run: echo "TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/muesli_test?sslmode=disable" >> "$GITHUB_ENV"
      - run: go build ./...
      - run: go vet ./...
      - name: Check gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need gofmt formatting:"
            echo "$files"
            exit 1
          fi
      - run: make check-test-determinism
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run go tests with coverage
        run: go test ./... -p 4 -parallel 2 -coverprofile=coverage.out
      - name: Report go coverage
        run: |
          summary=$(go tool cover -func=coverage.out | tail -1)
          echo "$summary"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

  embedded-integration:
    name: embedded-integration
    runs-on: ubuntu-latest
    env:
      BUNDLE_URL: https://github.com/boomship/postgres-vector-embedded/releases/download/v0.2.2/postgres-full-linux-x64.tar.gz
      BUNDLE_SHA256: 5b62bbc684d8d8fc813b42b88613c3ed631fbbe18440a6f68be873f406337a83
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.11'
      - name: Cache embedded Postgres bundle
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/embedded-postgres/postgres-full-linux-x64.tar.gz
          key: embedded-pg-bundle-${{ runner.os }}-x64-${{ env.BUNDLE_SHA256 }}
      - name: Download embedded Postgres bundle
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/embedded-postgres"
          mkdir -p "$bundle_dir"
          bundle_tar="$bundle_dir/postgres-full-linux-x64.tar.gz"
          if [ ! -f "$bundle_tar" ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$bundle_tar" "$BUNDLE_URL"
          fi
          echo "${BUNDLE_SHA256}  ${bundle_tar}" | sha256sum -c -
          tar -xzf "$bundle_tar" -C "$bundle_dir"
          echo "MUESLI_EMBEDDED_IT=1" >> "$GITHUB_ENV"
          echo "MUESLI_EMBEDDED_PG_BINARIES=$bundle_dir/postgres-full-linux-x64" >> "$GITHUB_ENV"
          echo "MUESLI_EMBEDDED_PGVECTOR_DIR=$bundle_dir/postgres-full-linux-x64" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$bundle_dir/postgres-full-linux-x64/lib" >> "$GITHUB_ENV"
      - run: go build ./...
      - run: go vet ./...
      - name: Build parent-death integration binaries
        run: |
          bin_dir="$RUNNER_TEMP/parent-death-integration"
          mkdir -p "$bin_dir"
          go build -o "$bin_dir/muesli" ./cmd/muesli
          go build -o "$bin_dir/whisper-cpp-transcriber" ./cmd/whisper-cpp-transcriber
          go build -o "$bin_dir/whisper-cpp-streaming" ./cmd/whisper-cpp-streaming
          echo "MUESLI_SERVER_BIN=$bin_dir/muesli" >> "$GITHUB_ENV"
          echo "MUESLI_WHISPER_CPP_TRANSCRIBER_BIN=$bin_dir/whisper-cpp-transcriber" >> "$GITHUB_ENV"
          echo "MUESLI_WHISPER_CPP_STREAMING_BIN=$bin_dir/whisper-cpp-streaming" >> "$GITHUB_ENV"
      - run: go test ./internal/embedded/... -run Integration -v
      - run: go test ./cmd/muesli/... -run TestEmbeddedMainE2E -v

  e2e-desktop:
    name: e2e-desktop
    runs-on: ubuntu-latest
    env:
      BUNDLE_URL: https://github.com/boomship/postgres-vector-embedded/releases/download/v0.2.2/postgres-full-linux-x64.tar.gz
      BUNDLE_SHA256: 5b62bbc684d8d8fc813b42b88613c3ed631fbbe18440a6f68be873f406337a83
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cache embedded Postgres bundle
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/embedded-postgres/postgres-full-linux-x64.tar.gz
          key: embedded-pg-bundle-${{ runner.os }}-x64-${{ env.BUNDLE_SHA256 }}
      - name: Download embedded Postgres bundle
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/embedded-postgres"
          mkdir -p "$bundle_dir"
          bundle_tar="$bundle_dir/postgres-full-linux-x64.tar.gz"
          if [ ! -f "$bundle_tar" ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$bundle_tar" "$BUNDLE_URL"
          fi
          echo "${BUNDLE_SHA256}  ${bundle_tar}" | sha256sum -c -
          tar -xzf "$bundle_tar" -C "$bundle_dir"
          echo "MUESLI_EMBEDDED_IT=1" >> "$GITHUB_ENV"
          echo "MUESLI_EMBEDDED_PG_BINARIES=$bundle_dir/postgres-full-linux-x64" >> "$GITHUB_ENV"
          echo "MUESLI_EMBEDDED_PGVECTOR_DIR=$bundle_dir/postgres-full-linux-x64" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$bundle_dir/postgres-full-linux-x64/lib" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build fake plugins
        run: |
          mkdir -p e2e/.bin
          go build -o e2e/.bin/fakeplugin-transcriber ./internal/pluginkit/fakeplugin
          cp e2e/.bin/fakeplugin-transcriber e2e/.bin/fakeplugin-agent
          go build -o e2e/.bin/muesli ./cmd/muesli
          go build -o e2e/.bin/whisper-cpp-streaming ./cmd/whisper-cpp-streaming
      - run: npm run build
      - name: Check e2e defect annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-e2e-defect-annotations.mjs
      - name: Run desktop E2E tests
        run: xvfb-run --auto-servernum npm run test:e2e
      # playwright-report/ is produced by the HTML reporter, which this project
      # does not configure, so this step uploaded nothing on every failing run --
      # silently, because if-no-files-found was `ignore`.
      #
      # The traces (use: { trace: 'retain-on-failure' }) go to test-results/ at
      # the REPO ROOT, not next to e2e/playwright.config.ts: Playwright defaults
      # outputDir relative to the package.json directory, not the config
      # directory. testDir is resolved relative to the config, which is what
      # makes the wrong guess so easy. Verified by running a failing test
      # through this exact layout before trusting it.
      #
      # `warn`, not `ignore`, so a wrong path says so instead of looking healthy.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: warn

  client:
    name: client (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build admin SPA
        run: make build-admin
      - name: Check admin embed contract
        run: node scripts/check-admin-dist.mjs
      - name: Lint (ESLint)
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      - run: npm run typecheck
      - name: Test coverage
        run: npm run test:coverage

  pluginkit-conformance:
    name: pluginkit-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.11'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install conformance harness
        run: |
          python -m pip install --upgrade pip
          pip install -e plugins/conformance
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run pluginkit conformance
        env:
          MUESLI_PLUGINKIT_CONFORMANCE: '1'
        run: go test ./internal/pluginkit/fakeplugin/... -run TestFakePluginConformance -v && go test ./cmd/whisper-cpp-transcriber/... -run TestWhisperCppTranscriberConformance -v

  lighthouse:
    name: lighthouse (a11y)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ensure Chrome
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1 || command -v google-chrome >/dev/null 2>&1; then
            echo "Chrome already present"; exit 0
          fi
          curl -fsSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/chrome.deb
          rm -f /tmp/chrome.deb
      - run: npm run build
      - run: npx @lhci/cli@0.14.x autorun

  plugins:
    name: plugins (python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: whisper-transcriber
            install: pip install -e '.[test]'
          - dir: parakeet-transcriber
            install: pip install -e '.[test]'
          - dir: streaming-transcriber
            install: pip install -e '.[test]'
          - dir: ollama-agent
            install: pip install -e '.[test]'
          - dir: conformance
            install: pip install -e ../whisper-transcriber && pip install -e ../ollama-agent && pip install -e ../parakeet-transcriber && pip install -e '.[test]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install (${{ matrix.dir }})
        working-directory: plugins/${{ matrix.dir }}
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}
      - name: Ruff TID gate (${{ matrix.dir }})
        working-directory: plugins/${{ matrix.dir }}
        run: |
          pip install 'ruff>=0.4'
          ruff check tests/ --select TID251
      - name: Test (${{ matrix.dir }})
        working-directory: plugins/${{ matrix.dir }}
        run: pytest

  plugins-gate:
    name: plugins (python) gate
    runs-on: ubuntu-latest
    needs: [plugins]
    if: always()
    steps:
      - name: Check plugins matrix result
        run: |
          echo "plugins matrix result: ${{ needs.plugins.result }}"
          if [ "${{ needs.plugins.result }}" != "success" ]; then
            exit 1
          fi

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [server, client]
    if: always()
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Evaluate CI results when relevant
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          SERVER_RESULT: ${{ needs.server.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
        run: |
          set -euo pipefail

          zero_sha=0000000000000000000000000000000000000000
          diff_available=true
          base_sha=
          head_sha=

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha=$PR_BASE_SHA
            head_sha=$PR_HEAD_SHA
          else
            head_sha=$CURRENT_SHA
            if [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "$zero_sha" ]; then
              base_sha=$PUSH_BEFORE_SHA
            elif base_sha=$(git rev-parse HEAD^ 2>/dev/null); then
              :
            else
              diff_available=false
            fi
          fi

          changed_files=()
          if [ "$diff_available" = true ]; then
            changed_file_list=$(mktemp)
            trap 'rm -f "$changed_file_list"' EXIT
            if git diff --name-only -z "$base_sha" "$head_sha" > "$changed_file_list"; then
              mapfile -d '' changed_files < "$changed_file_list"
            else
              diff_available=false
              changed_files=()
            fi
          fi

          all_ignored=false
          if [ "$diff_available" = true ] && [ "${#changed_files[@]}" -gt 0 ]; then
            all_ignored=true
            for file in "${changed_files[@]}"; do
              case "$file" in
                docs/*|*.md|.github/dependabot.yml|LICENSE) ;;
                *) all_ignored=false ;;
              esac
            done
          fi

          if [ "$all_ignored" = true ]; then
            {
              echo "## CI gate: not applicable"
              echo
              echo "All changed files are exempt because they match the documentation or maintenance-file ignore list:"
              printf -- '- `%s`\n' "${changed_files[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## CI gate: evaluating server (go) / client (node)"
            echo
            echo "This change requires real CI (or its changed-file list could not be determined)."
            echo
            echo "- server (go): \`$SERVER_RESULT\`"
            echo "- client (node): \`$CLIENT_RESULT\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SERVER_RESULT" != "success" ] || [ "$CLIENT_RESULT" != "success" ]; then
            exit 1
          fi
