name: Streaming nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  real-model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plugin test deps
        working-directory: plugins/streaming-transcriber
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Run real-model smoke
        working-directory: plugins/streaming-transcriber
        run: MUESLI_STREAMING_INTEGRATION=1 pytest tests/test_integration_real.py -v
