name: Image CI

on:
  pull_request:
    paths:
      - Dockerfile
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - web/admin/**
      - plugins/**
      - .github/workflows/image-ci.yml

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: .
            dockerfile: Dockerfile
            image: ghcr.io/abedegno/muesli-server
          - name: whisper-transcriber
            context: plugins/whisper-transcriber
            dockerfile: plugins/whisper-transcriber/Dockerfile
            image: ghcr.io/abedegno/muesli-whisper-transcriber
          - name: ollama-agent
            context: plugins/ollama-agent
            dockerfile: plugins/ollama-agent/Dockerfile
            image: ghcr.io/abedegno/muesli-ollama-agent
          - name: streaming-transcriber
            context: plugins/streaming-transcriber
            dockerfile: plugins/streaming-transcriber/Dockerfile
            image: ghcr.io/abedegno/muesli-streaming-transcriber
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
