name: Publish images

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: .
            dockerfile: Dockerfile
            image: ghcr.io/abedegno/muesli-server
            platforms: linux/amd64,linux/arm64
          - name: whisper-transcriber
            context: plugins/whisper-transcriber
            dockerfile: plugins/whisper-transcriber/Dockerfile
            image: ghcr.io/abedegno/muesli-whisper-transcriber
            platforms: linux/amd64,linux/arm64
          - name: ollama-agent
            context: plugins/ollama-agent
            dockerfile: plugins/ollama-agent/Dockerfile
            image: ghcr.io/abedegno/muesli-ollama-agent
            platforms: linux/amd64,linux/arm64
          - name: streaming-transcriber
            context: plugins/streaming-transcriber
            dockerfile: plugins/streaming-transcriber/Dockerfile
            image: ghcr.io/abedegno/muesli-streaming-transcriber
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and load ${{ matrix.name }} for scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ matrix.image }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan ${{ matrix.name }} image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:scan
          format: table
          output: trivy-${{ matrix.name }}.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 0
          trivyignores: .trivyignore

      - name: Upload Trivy report for ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.txt

      - name: Generate SBOM for ${{ matrix.name }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.image }}:scan
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artifact for ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json

      - name: Build and push ${{ matrix.name }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Attest build provenance for ${{ matrix.name }}
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release-assets:
    name: release assets
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the release asset bundle
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          mkdir -p dist
          # Version-pin the prod compose file: replace the ${MUESLI_IMAGE_TAG}
          # placeholder with the literal release tag so the bundle is
          # self-contained and does not depend on MUESLI_IMAGE_TAG in .env.
          sed "s#\${MUESLI_IMAGE_TAG}#$tag#g" docker-compose.prod.yml > dist/docker-compose.prod.yml
          cp .env.example dist/.env.example
          cp scripts/install.sh dist/install.sh
          ( cd dist && sha256sum docker-compose.prod.yml .env.example install.sh > SHA256SUMS )
          echo "Bundle contents:"
          ls -l dist

      - name: Publish the release with the asset bundle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/docker-compose.prod.yml
            dist/.env.example
            dist/install.sh
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
