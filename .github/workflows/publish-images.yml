name: Publish images

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: .
            dockerfile: Dockerfile
            image: ghcr.io/abedegno/muesli-server
            platforms: linux/amd64,linux/arm64
          - name: whisper-transcriber
            context: plugins/whisper-transcriber
            dockerfile: Dockerfile
            image: ghcr.io/abedegno/muesli-whisper-transcriber
            platforms: linux/amd64,linux/arm64
          - name: ollama-agent
            context: plugins/ollama-agent
            dockerfile: Dockerfile
            image: ghcr.io/abedegno/muesli-ollama-agent
            platforms: linux/amd64,linux/arm64
          - name: streaming-transcriber
            context: plugins/streaming-transcriber
            dockerfile: Dockerfile
            image: ghcr.io/abedegno/muesli-streaming-transcriber
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
