name: Desktop release (macOS)

# Signed + notarized macOS arm64 .dmg. Native arm64 build on macos-14: the Go
# server (make build), ollama-agent, and the whisper.cpp cgo transcriber (linked
# against an inline Metal lib build), then assemble the native deps and let
# electron-builder sign + (on tag) notarize + staple.
#
#   pull_request (packaging files) -> build + SIGN only (fast validation;
#     notarization is skipped, since it is slow and PR branches already carry
#     the signing secrets on this same-repo).
#   push tag desktop-v* / workflow_dispatch -> full build + sign + NOTARIZE +
#     staple, and attach the dmg to a GitHub Release.

on:
  pull_request:
    paths:
      - 'electron-builder.yml'
      - 'build/entitlements.mac.*'
      - 'scripts/assemble-desktop-resources.sh'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/desktop-release.yml'
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
  # Nightly build + packaged-app smoke of main. Catches breakage merged during
  # the day (Bircher merges do not gate on this workflow) before it reaches a
  # release. Signs but does not notarize, and publishes nothing.
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

env:
  WHISPER_REF: '080bbbe85230f624f0b52127f1ae1218247989f9'

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (arm64) + Metal SDK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Go tests (macOS-sensitive packages)
        run: go test ./internal/embedded/...

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build whisper.cpp static libs (Metal, arm64)
        run: |
          git clone https://github.com/ggml-org/whisper.cpp wcpp
          git -C wcpp checkout "$WHISPER_REF"
          ( cd wcpp/bindings/go && make whisper )
          mkdir -p wlib/lib wlib/include
          find wcpp/build_go \( -name 'libwhisper.a' -o -name 'libggml*.a' \) -exec cp {} wlib/lib/ \;
          cp wcpp/include/*.h wlib/include/
          cp wcpp/ggml/include/*.h wlib/include/
          echo "WLIB=$PWD/wlib" >> "$GITHUB_ENV"

      - name: Build Go binaries (native arm64)
        run: |
          mkdir -p build/bin
          make build
          cp bin/muesli build/bin/muesli
          go build -o build/bin/ollama-agent ./cmd/ollama-agent
          C_INCLUDE_PATH="$WLIB/include" LIBRARY_PATH="$WLIB/lib" CGO_ENABLED=1 \
            go build -tags whisper_cgo -o build/bin/whisper-cpp-transcriber ./cmd/whisper-cpp-transcriber

      - name: Build muesli-audiotap (Swift system-audio helper, macOS)
        # Pin the deployment target: the Core Audio process-tap API is macOS 14.2+,
        # and the runner toolchain's default target is lower (the helper is only
        # spawned on 14.4+ anyway; on older macOS it won't launch and capture
        # falls back to mic-only).
        run: xcrun swiftc -O -target arm64-apple-macos14.4 native/muesli-audiotap/main.swift -o build/bin/muesli-audiotap

      - name: Install node deps (brings ffmpeg-static)
        run: npm ci

      - name: Assemble desktop resources
        run: bash scripts/assemble-desktop-resources.sh darwin-arm64

      - name: Build + sign (+ notarize on tag)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Same-repo PR: force electron-builder to code-sign (it skips signing on
          # PR builds by default). CSC_FOR_PULL_REQUEST forces SIGNING only;
          # PUBLISH_FOR_PULL_REQUEST would additionally trigger a publish (needs
          # GH_TOKEN) which we do not want. Safe here -- not a fork.
          CSC_FOR_PULL_REQUEST: 'true'
        run: |
          # electron-builder's API-key notarization expects APPLE_API_KEY as a
          # path to the .p8; the secret stores it base64-encoded, so materialize.
          printf '%s' "$APPLE_API_KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          npx electron-vite build
          # --publish never: releases are attached by the softprops step below,
          # not by electron-builder.
          # Notarize ONLY for a release tag. "not a pull request" used to mean the
          # same thing, but a scheduled nightly is also not a pull request and must
          # not spend Apple notarization submissions on a discarded artifact.
          if [ "${{ startsWith(github.ref, 'refs/tags/desktop-v') }}" = "true" ]; then
            npx electron-builder --publish never
          else
            npx electron-builder --config.mac.notarize=false --publish never
          fi

      - name: Notarize + staple the dmg (release only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # electron-builder notarizes + staples the .app INSIDE the dmg, but not
          # the disk image itself. Notarize + staple the dmg too so a downloaded
          # dmg is Gatekeeper-clean on first mount, offline.
          DMG="$(find dist-desktop -maxdepth 1 -name '*.dmg' | head -1)"
          printf '%s' "$APPLE_API_KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Verify signature + notarization
        run: |
          APP="$(find dist-desktop -maxdepth 3 -name '*.app' -type d | head -1)"
          DMG="$(find dist-desktop -maxdepth 1 -name '*.dmg' | head -1)"
          echo "app=$APP"; echo "dmg=$DMG"
          # The app must be validly signed with hardened runtime everywhere.
          codesign --verify --deep --strict --verbose=2 "$APP"
          # On a release the app AND the dmg must be notarized + stapled.
          # Only a release tag has a stapled ticket to validate. A nightly signs but
          # does not notarize, so validating here would fail every night.
          if [ "${{ startsWith(github.ref, 'refs/tags/desktop-v') }}" = "true" ]; then
            # stapler validate is the authoritative proof the notarization ticket
            # is attached to each artifact.
            xcrun stapler validate "$APP"
            xcrun stapler validate "$DMG"
            # Gatekeeper acceptance of the app, informational + non-fatal: spctl's
            # dmg/primary-signature assessment rejects a stapled-but-unsigned dmg
            # ("no usable signature") even though it is correctly notarized, so it
            # is not a reliable gate. The stapler validations above are.
            spctl -a -t exec -vv "$APP" || echo "note: spctl app assessment non-zero (informational only)"
          fi

      - name: Smoke test packaged dmg (mounted app must mount)
        run: |
          DMG="$(find dist-desktop -maxdepth 1 -name '*.dmg' | head -1)"
          MOUNT_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/muesli-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true
            rmdir "$MOUNT_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "mounting $DMG at $MOUNT_DIR"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_DIR" "$DMG" >/dev/null
          APP="$(find "$MOUNT_DIR" -maxdepth 2 -name '*.app' -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "no .app bundle found inside mounted dmg at $MOUNT_DIR" >&2
            exit 1
          fi
          echo "smoking mounted app $APP"
          if node -e 'process.exit(typeof WebSocket === "undefined" ? 1 : 0)'; then
            node scripts/smoke-desktop.mjs "$APP" --port 9455
          else
            node --experimental-websocket scripts/smoke-desktop.mjs "$APP" --port 9455
          fi

      - name: Smoke test packaged dmg (user journey)
        run: |
          DMG="$(find dist-desktop -maxdepth 1 -name '*.dmg' | head -1)"
          MOUNT_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/muesli-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true
            rmdir "$MOUNT_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "mounting $DMG at $MOUNT_DIR"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_DIR" "$DMG" >/dev/null
          APP="$(find "$MOUNT_DIR" -maxdepth 2 -name '*.app' -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "no .app bundle found inside mounted dmg at $MOUNT_DIR" >&2
            exit 1
          fi
          echo "smoking journey on mounted app $APP"
          if node -e 'process.exit(typeof WebSocket === "undefined" ? 1 : 0)'; then
            node scripts/smoke-desktop.mjs "$APP" --port 9455 --journey
          else
            node --experimental-websocket scripts/smoke-desktop.mjs "$APP" --port 9455 --journey
          fi

      # Launch the BUILT app and prove the renderer actually mounts. Unit tests
      # stub `window.muesli` with a plain object, so they cannot catch a
      # contextBridge-only failure — v0.1.10 shipped a blank window with a fully
      # green suite. This gate runs before the artifact is uploaded or attached
      # to a release, so a dead-on-arrival build fails the job instead.
      - name: Smoke test packaged app (renderer must mount)
        run: |
          APP="$(find dist-desktop -maxdepth 3 -name '*.app' -type d | head -1)"
          echo "smoking $APP"
          # WebSocket is global on Node >=22 but flag-gated on Node 20.
          if node -e 'process.exit(typeof WebSocket === "undefined" ? 1 : 0)'; then
            node scripts/smoke-desktop.mjs "$APP"
          else
            node --experimental-websocket scripts/smoke-desktop.mjs "$APP"
          fi

      - name: Smoke test packaged app (user journey)
        run: |
          APP="$(find dist-desktop -maxdepth 3 -name '*.app' -type d | head -1)"
          echo "smoking journey on $APP"
          # WebSocket is global on Node >=22 but flag-gated on Node 20.
          if node -e 'process.exit(typeof WebSocket === "undefined" ? 1 : 0)'; then
            node scripts/smoke-desktop.mjs "$APP" --journey
          else
            node --experimental-websocket scripts/smoke-desktop.mjs "$APP" --journey
          fi

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: muesli-macos-arm64-dmg
          path: dist-desktop/*.dmg
          retention-days: 30

      - name: Attach to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/*.dmg
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build toolchain (Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential cmake git

      - name: Build whisper.cpp static libs (CPU, linux-amd64)
        run: |
          git clone https://github.com/ggml-org/whisper.cpp wcpp
          git -C wcpp checkout "$WHISPER_REF"
          ( cd wcpp/bindings/go && make whisper )
          mkdir -p wlib/lib wlib/include
          find wcpp/build_go \( -name 'libwhisper.a' -o -name 'libggml*.a' \) -exec cp {} wlib/lib/ \;
          cp wcpp/include/*.h wlib/include/
          cp wcpp/ggml/include/*.h wlib/include/
          echo "WLIB=$PWD/wlib" >> "$GITHUB_ENV"

      - name: Build Go binaries (native amd64)
        run: |
          mkdir -p build/bin
          make build
          cp bin/muesli build/bin/muesli
          go build -o build/bin/ollama-agent ./cmd/ollama-agent
          C_INCLUDE_PATH="$WLIB/include" LIBRARY_PATH="$WLIB/lib" CGO_ENABLED=1 \
            go build -tags whisper_cgo -o build/bin/whisper-cpp-transcriber ./cmd/whisper-cpp-transcriber

      - name: Install node deps (brings ffmpeg-static)
        run: npm ci

      - name: Assemble desktop resources
        run: bash scripts/assemble-desktop-resources.sh linux-x64

      - name: Build (unsigned AppImage)
        run: |
          npx electron-vite build
          npx electron-builder --linux AppImage --publish never

      - name: Smoke test AppImage (renderer must mount)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          APPIMAGE="$(find dist-desktop -maxdepth 1 -name '*.AppImage' | head -1)"
          if [ -z "$APPIMAGE" ]; then
            echo "no AppImage found in dist-desktop" >&2
            exit 1
          fi
          chmod +x "$APPIMAGE"
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          if ! command -v dbus-run-session >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y dbus-x11
          fi
          echo "smoking $APPIMAGE"
          if node -e 'process.exit(typeof WebSocket === "undefined" ? 1 : 0)'; then
            xvfb-run -a dbus-run-session -- node scripts/smoke-desktop.mjs "$APPIMAGE" --port 9460 --no-sandbox
          else
            xvfb-run -a dbus-run-session -- node --experimental-websocket scripts/smoke-desktop.mjs "$APPIMAGE" --port 9460 --no-sandbox
          fi

      - name: Smoke test AppImage (user journey)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          APPIMAGE="$(find dist-desktop -maxdepth 1 -name '*.AppImage' | head -1)"
          if [ -z "$APPIMAGE" ]; then
            echo "no AppImage found in dist-desktop" >&2
            exit 1
          fi
          chmod +x "$APPIMAGE"
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          if ! command -v dbus-run-session >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y dbus-x11
          fi
          echo "smoking journey on $APPIMAGE"
          if node -e 'process.exit(typeof WebSocket === "undefined" ? 1 : 0)'; then
            xvfb-run -a dbus-run-session -- node scripts/smoke-desktop.mjs "$APPIMAGE" --port 9460 --no-sandbox --journey
          else
            xvfb-run -a dbus-run-session -- node --experimental-websocket scripts/smoke-desktop.mjs "$APPIMAGE" --port 9460 --no-sandbox --journey
          fi

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: muesli-linux-x64-appimage
          path: dist-desktop/*.AppImage
          retention-days: 30

      - name: Attach to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/*.AppImage

  notify-nightly-failure:
    # A scheduled run has nobody watching it, so a failure must land somewhere
    # durable. Deliberately excludes pull_request and tag runs: those already
    # have a human attached, and issues from them would be noise.
    needs: [build, build-linux]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      # A job-level permissions block REPLACES the workflow-level one, so every
      # scope this job needs must be listed: issues to file/comment, actions to
      # read the failed logs, contents to resolve the repo.
      issues: write
      actions: read
      contents: read
    steps:
      - name: File or update the nightly failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAC_RESULT: ${{ needs.build.result }}
          LINUX_RESULT: ${{ needs['build-linux'].result }}
        run: |
          set -euo pipefail
          LABEL=nightly-desktop-failure

          # `gh issue create --label` fails if the label does not exist, which would
          # lose the report entirely. Create it idempotently first.
          gh label create "$LABEL" --repo "$REPO" \
            --color B60205 --description "Nightly desktop build failed" --force >/dev/null 2>&1 || true

          # The [smoke] lines are the most diagnostic output this workflow produces;
          # include them so the issue is triageable without opening the run.
          SMOKE=$(gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null \
            | grep -oE '\[smoke\][^\r]*' | head -20 || true)
          [ -n "$SMOKE" ] || SMOKE='(no [smoke] output — the failure was before the smoke steps)'

          BODY=$(printf '%s\n' \
            "Nightly desktop build failed on \`main\`." \
            "" \
            "| job | result |" \
            "| --- | --- |" \
            "| \`build\` (macOS) | $MAC_RESULT |" \
            "| \`build-linux\` | $LINUX_RESULT |" \
            "" \
            "Run: $RUN_URL" \
            "" \
            "Smoke output:" \
            '```' \
            "$SMOKE" \
            '```' \
            "" \
            "_Filed automatically. Not queued to Bircher: this report says the nightly failed, not why._")

          EXISTING=$(gh issue list --repo "$REPO" --label "$LABEL" --state open \
            --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "commenting on existing issue #$EXISTING"
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            echo "creating new tracking issue"
            gh issue create --repo "$REPO" --label "$LABEL" \
              --title "Nightly desktop build failing" --body "$BODY"
          fi
