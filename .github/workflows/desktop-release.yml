name: Desktop release (macOS)

# Signed + notarized macOS arm64 .dmg. Native arm64 build on macos-14: the Go
# server (make build), ollama-agent, and the whisper.cpp cgo transcriber (linked
# against an inline Metal lib build), then assemble the native deps and let
# electron-builder sign + (on tag) notarize + staple.
#
#   pull_request (packaging files) -> build + SIGN only (fast validation;
#     notarization is skipped, since it is slow and PR branches already carry
#     the signing secrets on this same-repo).
#   push tag desktop-v* / workflow_dispatch -> full build + sign + NOTARIZE +
#     staple, and attach the dmg to a GitHub Release.

on:
  pull_request:
    paths:
      - 'electron-builder.yml'
      - 'build/entitlements.mac.*'
      - 'scripts/assemble-desktop-resources.sh'
      - '.github/workflows/desktop-release.yml'
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  WHISPER_REF: '080bbbe85230f624f0b52127f1ae1218247989f9'

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (arm64) + Metal SDK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build whisper.cpp static libs (Metal, arm64)
        run: |
          git clone https://github.com/ggml-org/whisper.cpp wcpp
          git -C wcpp checkout "$WHISPER_REF"
          ( cd wcpp/bindings/go && make whisper )
          mkdir -p wlib/lib wlib/include
          find wcpp/build_go \( -name 'libwhisper.a' -o -name 'libggml*.a' \) -exec cp {} wlib/lib/ \;
          cp wcpp/include/*.h wlib/include/
          cp wcpp/ggml/include/*.h wlib/include/
          echo "WLIB=$PWD/wlib" >> "$GITHUB_ENV"

      - name: Build Go binaries (native arm64)
        run: |
          mkdir -p build/bin
          make build
          cp bin/muesli build/bin/muesli
          go build -o build/bin/ollama-agent ./cmd/ollama-agent
          C_INCLUDE_PATH="$WLIB/include" LIBRARY_PATH="$WLIB/lib" CGO_ENABLED=1 \
            go build -tags whisper_cgo -o build/bin/whisper-cpp-transcriber ./cmd/whisper-cpp-transcriber

      - name: Install node deps (brings ffmpeg-static)
        run: npm ci

      - name: Assemble desktop resources
        run: bash scripts/assemble-desktop-resources.sh darwin-arm64

      - name: Build + sign (+ notarize on tag)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Same-repo PR: force electron-builder to code-sign (it skips signing on
          # PR builds by default). CSC_FOR_PULL_REQUEST forces SIGNING only;
          # PUBLISH_FOR_PULL_REQUEST would additionally trigger a publish (needs
          # GH_TOKEN) which we do not want. Safe here -- not a fork.
          CSC_FOR_PULL_REQUEST: 'true'
        run: |
          # electron-builder's API-key notarization expects APPLE_API_KEY as a
          # path to the .p8; the secret stores it base64-encoded, so materialize.
          printf '%s' "$APPLE_API_KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          npx electron-vite build
          # --publish never: releases are attached by the softprops step below,
          # not by electron-builder.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx electron-builder --config.mac.notarize=false --publish never
          else
            npx electron-builder --publish never
          fi

      - name: Notarize + staple the dmg (release only)
        if: github.event_name != 'pull_request'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # electron-builder notarizes + staples the .app INSIDE the dmg, but not
          # the disk image itself. Notarize + staple the dmg too so a downloaded
          # dmg is Gatekeeper-clean on first mount, offline.
          DMG="$(find dist-desktop -maxdepth 1 -name '*.dmg' | head -1)"
          printf '%s' "$APPLE_API_KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Verify signature + notarization
        run: |
          APP="$(find dist-desktop -maxdepth 3 -name '*.app' -type d | head -1)"
          DMG="$(find dist-desktop -maxdepth 1 -name '*.dmg' | head -1)"
          echo "app=$APP"; echo "dmg=$DMG"
          # The app must be validly signed with hardened runtime everywhere.
          codesign --verify --deep --strict --verbose=2 "$APP"
          # On a release the app AND the dmg must be notarized + stapled.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            xcrun stapler validate "$APP"
            xcrun stapler validate "$DMG"
            spctl -a -t open --context context:primary-signature -v "$DMG"
          fi

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: muesli-macos-arm64-dmg
          path: dist-desktop/*.dmg
          retention-days: 30

      - name: Attach to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/*.dmg
