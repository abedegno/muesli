<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="560" fill="#f5f5f5"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="560" fill="#1e1e2e"/>

  <!-- Sidebar header -->
  <text x="20" y="34" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="0.5">🥣 Muesli</text>
  <line x1="0" y1="50" x2="220" y2="50" stroke="#2e2e3e" stroke-width="1"/>

  <!-- Sidebar label -->
  <text x="20" y="76" font-size="11" font-weight="600" fill="#6e6e9e" letter-spacing="1">NOTES</text>

  <!-- Item 1 — active -->
  <rect x="8" y="88" width="204" height="52" rx="6" fill="#7c3aed" opacity="0.85"/>
  <text x="20" y="109" font-size="13" font-weight="600" fill="#ffffff">Team Standup</text>
  <text x="20" y="127" font-size="11" fill="#d8b4fe">29 Jun 2026 · 3 min</text>

  <!-- Item 2 -->
  <text x="20" y="169" font-size="13" font-weight="500" fill="#c4c4d4">Product Review</text>
  <text x="20" y="187" font-size="11" fill="#6e6e9e">27 Jun 2026 · 8 min</text>

  <!-- Item 3 -->
  <text x="20" y="229" font-size="13" font-weight="500" fill="#c4c4d4">Architecture Sync</text>
  <text x="20" y="247" font-size="11" fill="#6e6e9e">25 Jun 2026 · 12 min</text>

  <!-- Item 4 -->
  <text x="20" y="289" font-size="13" font-weight="500" fill="#c4c4d4">1:1 with Alex</text>
  <text x="20" y="307" font-size="11" fill="#6e6e9e">23 Jun 2026 · 5 min</text>

  <!-- Item 5 -->
  <text x="20" y="349" font-size="13" font-weight="500" fill="#c4c4d4">Sprint Planning</text>
  <text x="20" y="367" font-size="11" fill="#6e6e9e">20 Jun 2026 · 15 min</text>

  <!-- New note button -->
  <rect x="12" y="494" width="196" height="38" rx="8" fill="#7c3aed"/>
  <text x="110" y="518" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">+ New Note</text>

  <!-- Main panel -->
  <rect x="220" y="0" width="680" height="560" fill="#f5f5f5"/>

  <!-- Top bar -->
  <rect x="220" y="0" width="680" height="52" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="250" y="32" font-size="18" font-weight="700" fill="#1e1e2e">Team Standup — 29 Jun 2026</text>

  <!-- Summary badge -->
  <rect x="688" y="14" width="92" height="26" rx="13" fill="#ede9fe"/>
  <text x="734" y="32" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle">✓ Summarized</text>

  <!-- Divider -->
  <line x1="220" y1="52" x2="900" y2="52" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Action Items section -->
  <text x="258" y="98" font-size="15" font-weight="700" fill="#1e1e2e">Action Items</text>
  <line x1="258" y1="106" x2="840" y2="106" stroke="#e5e7eb" stroke-width="1"/>

  <circle cx="270" cy="126" r="4" fill="#7c3aed"/>
  <text x="284" y="131" font-size="13" fill="#374151">Finalize API contract for plugin registry endpoint</text>

  <circle cx="270" cy="150" r="4" fill="#7c3aed"/>
  <text x="284" y="155" font-size="13" fill="#374151">Add smoke-test coverage for the Whisper transcriber plugin</text>

  <circle cx="270" cy="174" r="4" fill="#7c3aed"/>
  <text x="284" y="179" font-size="13" fill="#374151">Update CHANGELOG with latest pre-1.0 entries</text>

  <!-- Decisions section -->
  <text x="258" y="218" font-size="15" font-weight="700" fill="#1e1e2e">Decisions</text>
  <line x1="258" y1="226" x2="840" y2="226" stroke="#e5e7eb" stroke-width="1"/>

  <circle cx="270" cy="246" r="4" fill="#7c3aed"/>
  <text x="284" y="251" font-size="13" fill="#374151">Keep Ollama as the default LLM backend for self-hosted installs</text>

  <circle cx="270" cy="270" r="4" fill="#7c3aed"/>
  <text x="284" y="275" font-size="13" fill="#374151">Ship desktop client as Electron until a better cross-platform option emerges</text>

  <!-- Summary section -->
  <text x="258" y="318" font-size="15" font-weight="700" fill="#1e1e2e">Summary</text>
  <line x1="258" y1="326" x2="840" y2="326" stroke="#e5e7eb" stroke-width="1"/>

  <text x="258" y="351" font-size="13" fill="#374151">The team reviewed outstanding plugin work and confirmed priorities for the</text>
  <text x="258" y="371" font-size="13" fill="#374151">next sprint. Transcription quality is on track; the main blocker is finalizing</text>
  <text x="258" y="391" font-size="13" fill="#374151">the plugin registry API so third-party engines can register automatically.</text>
  <text x="258" y="419" font-size="13" fill="#374151">No blockers were raised for the Docker Compose stack. The team agreed to</text>
  <text x="258" y="439" font-size="13" fill="#374151">keep the self-hosted-first approach and revisit cloud-LLM options post-1.0.</text>

  <!-- Bottom bar -->
  <rect x="220" y="520" width="680" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="250" y="546" font-size="11" fill="#9ca3af">Raw transcript · 3 min · Whisper base model</text>
  <rect x="780" y="530" width="100" height="22" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="830" y="546" font-size="11" fill="#374151" text-anchor="middle">View transcript</text>
</svg>
